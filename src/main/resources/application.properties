spring.application.name=phongkham

# Ket noi SQL Server
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=QuanLyPhongKham;encrypt=true;trustServerCertificate=true;sendTimeAsDatetime=false
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Jackson 3: khong suy dien creator tu ten tham so constructor.
# Neu bat (mac dinh), @AllArgsConstructor cua entity duoc chon lam creator va
# gia tri mac dinh cua field (vd trangThai = true) bi ghi de bang null.
spring.jackson.mapper.detect-parameter-names=false

# Khong lo thong tin noi bo khi co loi
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-exception=false

spring.config.import=optional:file:.env[.properties]
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.1-flash-lite
gemini.fallback-model=gemini-3.5-flash